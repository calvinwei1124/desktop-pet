<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>桌面宠物设置</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      margin: 0;
      padding: 20px;
      color: #1f2937;
      background: #f7f8fa;
    }
    h1 { font-size: 18px; margin: 0 0 4px; }
    .sub { font-size: 12px; color: #6b7280; margin-bottom: 14px; }
    .card { background: #fff; border-radius: 12px; padding: 14px 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 14px; }
    .row { margin: 14px 0; }
    label { display: block; font-size: 13px; margin-bottom: 6px; font-weight: 600; }
    .val { float: right; font-weight: 400; color: #6b7280; }
    select, input[type=range] { width: 100%; box-sizing: border-box; }
    select { padding: 6px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
    .check { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 400; margin: 10px 0; }
    .check input { width: 16px; height: 16px; }
    .hint { font-size: 12px; color: #6b7280; line-height: 1.6; }
    code { background: #eef2f7; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
    button {
      margin-top: 4px; width: 100%; padding: 11px;
      background: #3b82f6; color: #fff; border: none; border-radius: 10px;
      font-size: 14px; cursor: pointer;
    }
    button:hover { background: #2f6fe0; }
    #pdToggle, #pdReset { flex: 1; margin-top: 0; }
    button.secondary { background: #e5e7eb; color: #374151; }
    button.secondary:hover { background: #d1d5db; }
  </style>
</head>
<body>
  <h1>桌面宠物设置</h1>
  <div class="sub">在屏幕上点一下宠物是"抚摸"，拖动可移动，双击打开本设置。</div>

  <div class="card">
    <div class="row">
      <label>当前角色</label>
      <select id="char"></select>
    </div>
    <div class="row">
      <label>大小 <span class="val" id="scaleVal">1.0</span></label>
      <input type="range" id="scale" min="0.5" max="2" step="0.1" value="1" />
    </div>
    <div class="row">
      <label>透明度 <span class="val" id="opacityVal">1.00</span></label>
      <input type="range" id="opacity" min="0.3" max="1" step="0.05" value="1" />
    </div>
    <label class="check"><input type="checkbox" id="ct" /> 点击穿透（宠物不挡鼠标，纯装饰）</label>
    <label class="check"><input type="checkbox" id="spaces" /> 在所有桌面/空间的窗口上都显示</label>
    <label class="check"><input type="checkbox" id="auto" /> 开机自动启动</label>
  </div>

  <div class="card">
    <div class="row" style="margin-top:0">
      <label>🍅 番茄工作法</label>
    </div>
    <label class="check"><input type="checkbox" id="pdEnabled" /> 启用番茄钟（桌面计时 + 休息提醒）</label>
    <div class="row">
      <label>工作时长（分钟）<span class="val" id="workVal">25</span></label>
      <input type="range" id="pdWork" min="5" max="60" step="5" value="25" />
    </div>
    <div class="row">
      <label>短休息（分钟）<span class="val" id="shortVal">5</span></label>
      <input type="range" id="pdShort" min="1" max="15" step="1" value="5" />
    </div>
    <div class="row">
      <label>长休息（分钟）<span class="val" id="longVal">15</span></label>
      <input type="range" id="pdLong" min="5" max="30" step="5" value="15" />
    </div>
    <div class="row">
      <label>每几个番茄后长休息<span class="val" id="everyVal">4</span></label>
      <input type="range" id="pdEvery" min="2" max="8" step="1" value="4" />
    </div>
    <label class="check"><input type="checkbox" id="pdNotify" /> 系统通知（弹窗提醒休息 / 工作）</label>
    <label class="check"><input type="checkbox" id="pdAutoBreak" /> 工作结束后自动开始休息</label>
    <label class="check"><input type="checkbox" id="pdAutoWork" /> 休息结束后自动开始工作</label>
    <div style="display:flex; gap:8px; margin-top:6px">
      <button id="pdToggle" type="button">开始 / 暂停</button>
      <button id="pdReset" type="button" class="secondary">重置</button>
    </div>
    <div class="hint" id="pdStatus" style="margin-top:8px">状态：未开始</div>
  </div>

  <div class="card">
    <div class="hint">
      <b>如何新增角色？</b><br />
      打开项目里的 <code>characters.js</code>，在数组末尾加一个对象即可：<br />
      <code>{ id:'xxx', name:'名称', bg:'#颜色', svg:'&lt;svg ...&gt;', phrases:['台词1','台词2'] }</code><br />
      保存后重新运行 <code>npm start</code>，新角色会自动出现在角色列表与托盘菜单中。
    </div>
  </div>

  <button id="closeBtn">关闭</button>
  <script src="settings.js"></script>
</body>
</html>
